name: CI - Streamlit Application

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XDG_DATA_HOME: ${{ runner.temp }}/xdg-data

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q app_config.py linkedin_content_manager.py streamlit_app.py tests

      - name: Run automated tests
        run: python -m pytest -q

      - name: Smoke-test Streamlit startup
        shell: bash
        run: |
          set -euo pipefail
          streamlit run streamlit_app.py \
            --server.headless true \
            --server.port 8501 \
            > streamlit-smoke.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo
              echo "Streamlit health check passed."
              exit 0
            fi

            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Streamlit stopped before becoming healthy."
              cat streamlit-smoke.log
              exit 1
            fi

            sleep 1
          done

          echo "Streamlit did not become healthy within 30 seconds."
          cat streamlit-smoke.log
          exit 1
